name: Tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  test:
    name: Test
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux-stable, macos-stable, windows-stable]
        include:
          - build: linux-stable
            os: ubuntu-latest
            rust: stable
          - build: macos-stable
            os: macos-latest
            rust: stable
          - build: windows-stable
            os: windows-latest
            rust: stable
    steps:
      - uses: actions/checkout@v4
      - uses: nanasess/setup-chromedriver@master
      - if: matrix.os == 'macos-latest'
        run: brew install --cask firefox
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v3
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-build-${{ hashFiles('Cargo.lock') }}
      - name: Run Tests
        run: cargo test --all --locked
        env:
          RUST_BACKTRACE: 1
      - name: Clippy
        run: cargo clippy
      - name: Cargo fmt
        run: cargo fmt --all -- --check

  test-emscripten:
    name: Test (emscripten)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: actions/setup-node@v3
        with:
          node-version: "24"
      - uses: mymindstorm/setup-emsdk@v14
      # `-sWASM_BINDGEN=auto` (marker-section detection when rustc drives
      # emcc as the linker) has not landed in an emscripten release yet.
      # Overlay the branch carrying it on top of emsdk's toolchain until it
      # does.
      # TODO: drop this overlay once -sWASM_BINDGEN=auto ships in emsdk.
      - name: Install emscripten WASM_BINDGEN branch
        run: |
          git clone --depth 1 -b cf https://github.com/guybedford/emscripten ~/emscripten
          # bootstrap runs npm install and generates the emcc/em++ launcher
          # scripts (they are not tracked in the repo).
          cd ~/emscripten && python3 bootstrap.py
          # Drive the branch checkout with emsdk's LLVM/binaryen toolchain.
          echo "EM_CONFIG=$EMSDK/.emscripten" >> "$GITHUB_ENV"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-emscripten-${{ hashFiles('Cargo.lock') }}
      - name: Run emscripten tests
        # The branch checkout must shadow emsdk's bundled emcc on PATH.
        run: |
          export PATH="$HOME/emscripten:$PATH"
          which -a emcc
          ls -la "$HOME/emscripten/emcc" || true
          emcc --version | head -1
          emcc --version | head -1 | grep -q -- -git || { echo "wrong emcc resolved"; exit 1; }
          # Single-threaded: parallel fixtures race the shared tool cache
          # (cargo-install fallback renames into the same directory).
          cargo test --test all emscripten:: --locked -- --test-threads=1
        env:
          RUST_BACKTRACE: 1
